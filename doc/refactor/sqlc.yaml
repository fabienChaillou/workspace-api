version: "2"
# Noms de champs Go (sinon sqlc génère VcsUrl).
overrides:
  go:
    rename:
      vcs_url: "VcsURL"
sql:
  - engine: "postgresql"
    # sqlc lit les migrations dans l'ordre et ignore les fichiers *.down.sql.
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_empty_slices: true             # [] plutôt que nil en JSON
        emit_pointers_for_null_types: true  # colonnes nullables -> *string, *time.Time...
        emit_interface: true                # interface Querier, pratique pour les mocks
        overrides:
          # UUID : google/uuid plutôt que pgtype.UUID.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          # timestamptz : time.Time / *time.Time plutôt que pgtype.Timestamptz.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # Optionnel : brancher tes types métier. Remplace le chemin d'import
          # par le package où sont définis WorkspaceStatus, ActionType et EnvVars.
          #
          # - column: "workspaces.status"
          #   go_type: "github.com/example/terraform-module/internal/domain.WorkspaceStatus"
          # - column: "actions.type"
          #   go_type: "github.com/example/terraform-module/internal/domain.ActionType"
          # - column: "workspaces.env_vars"
          #   go_type:
          #     import: "github.com/example/terraform-module/internal/domain"
          #     type: "EnvVars"
          #     slice: true
